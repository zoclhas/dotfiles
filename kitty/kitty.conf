# Font
# font_family      family="JetBrainsMonoNL Nerd Font Mono"
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size 12.0
disable_ligatures never

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
# window_margin_width 3 9 3 9

# No stupid close confirmation
confirm_os_window_close 0

kitty_mod ctrl+shift

# Use fish shell
shell fish

# Copy
map ctrl+c copy_or_interrupt

# Search
map ctrl+alt+f launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up scroll_page_up
map page_down scroll_page_down

# map ctrl+plus  change_font_size all +1
# map ctrl+equal  change_font_size all +1
# map ctrl+kp_add  change_font_size all +1
# map ctrl+minus       change_font_size all -1
# map ctrl+underscore       change_font_size all -1
# map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

map ctrl+shift+t new_tab_with_cwd
map ctrl+[ previous_tab
map ctrl+] next_tab

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

map ctrl+shift+o launch --location=vsplit
map ctrl+shift+e launch --location=hsplit

# Theme
background           #090E13
foreground           #DCD7BA
selection_background #2D4F67
selection_foreground #C8C093
url_color            #72A7BC
cursor               #C8C093

# foreground #090E13
# background #DCD7BA
# selection_foreground #2D4F67
# selection_background #C8C093
# url_color #72A7BC
# cursor #C8C093

# Tabs
active_tab_background   #1F1F28
active_tab_foreground   #C8C093
inactive_tab_background #1F1F28
inactive_tab_foreground #727169
#tab_bar_background #15161E

# normal
color0 #16161D
color1 #C34043
